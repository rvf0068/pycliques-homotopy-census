name: Small census and validation
on: [push, pull_request]
jobs:
  order10-exact-types:
    name: Replay the order-10 homotopy certificates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: upstream
        name: Read the follow-up algorithm revision
        run: echo "revision=$(cat config/order10_exact_types_commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: rvf0068/pycliques-project
          ref: ${{ steps.upstream.outputs.revision }}
          path: .deps/pycliques-order10-types
      - uses: astral-sh/setup-uv@v4
      - name: Install the pinned monorepo packages
        run: uv sync --project .deps/pycliques-order10-types --frozen --no-dev --python 3.11
      - name: Check exact wedges, proof methods, and the exception table
        run: .deps/pycliques-order10-types/.venv/bin/python audits/order10_exact_types.py --check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin and install research dependencies
        run: bash scripts/bootstrap.sh
      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Isolate new runner outputs from committed historical results
        run: |
          mv runs "$RUNNER_TEMP/baseline-runs"
          mkdir runs
      - name: Run and validate all stages through order 8
        run: |
          for stage in through6 7 8; do
            bash scripts/run.sh "$stage"
            .venv/bin/python scripts/validate.py --stage "$stage"
          done
      - name: Independently compare all 12,113 scientific records
        run: |
          .venv/bin/python audits/compare_results.py \
            --baseline "$RUNNER_TEMP/baseline-runs" --candidate runs \
            --stage through6 --stage 7 --stage 8
      - name: Generate root-level non-Helly report from completed results
        run: |
          .venv/bin/python reports/non_helly.py --stage through6
          test -s non_helly_through6.md
      - name: Confirm idempotent resume
        run: bash scripts/run.sh through6
      - name: Confirm completed stages are safe to update
        run: .venv/bin/python scripts/versioning.py
      - name: Revalidate with exact historical census and upstream revisions
        run: bash scripts/validate_historical.sh through6
      - name: Preserve baseline run for download
        uses: actions/upload-artifact@v4
        with:
          name: homotopy-census-through6
          path: |
            runs/through6/
            non_helly_through6.md
          if-no-files-found: error
          retention-days: 90
